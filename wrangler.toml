name = "sayyad-bot"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

# The provider, model, thinking level, safety levels and media limits are NOT here:
# they live in KV and are edited from the /admin panel. Switching provider is a Save,
# not a deploy. See src/store.js for the schema and src/llm.js for the dispatcher.

# ---------------------------------------------------------------- vars
[vars]
# Base64 of a 16x16 PNG, used by /diag to check the image path.
DIAG_IMAGE = "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAAFklEQVR4nGNwa9pCEmIY1TCqYfhqAACXG3wQdHVYSAAAAABJRU5ErkJggg=="

# ---------------------------------------------------------------- secrets
# These live in Cloudflare, not in this file.
#   TELEGRAM_BOT_TOKEN  from @BotFather
#   ADMIN_PASSWORD      your own password for /admin
#   GEMINI_API_KEY      from https://aistudio.google.com/apikey   (native: video + audio)
#   API_KEY             any OpenAI-compatible key, optional      (takes priority)
#   OPENROUTER_API_KEY  OpenRouter, optional fallback
#
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put ADMIN_PASSWORD
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put API_KEY

# ---------------------------------------------------------------- storage
# Config, statistics and the 200-message archive all live here.
# Create once:  npx wrangler kv namespace create CONFIG
# then paste the printed id below.
[[kv_namespaces]]
binding = "CONFIG"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"